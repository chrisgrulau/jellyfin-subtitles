name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  # Every pull request, including ones stacked on another feature branch
  pull_request:

# Least privilege by default; only the release job may write
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shared source (jellyfin-plugin-common) is compiled into the plugin
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The newest .NET 10 SDK; global.json only sets the floor (any .NET 10 SDK, including Linux distribution
          # packages, which ship the 10.0.1xx series). Package versions are locked, so builds stay reproducible.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Subtitles.sln --locked-mode

      - name: Build
        run: dotnet build Jellyfin.Plugin.Subtitles.sln --configuration Release --no-restore

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --solution Jellyfin.Plugin.Subtitles.sln --configuration Release --no-build 2>&1 | tee test-output.log

      - name: Annotate failed tests
        if: failure() && steps.test.outcome == 'failure'
        shell: python
        run: |
          # Surface the end of the test output as an annotation (readable on the PR without opening logs)
          tail = open("test-output.log", encoding="utf-8", errors="replace").read().splitlines()[-60:]
          body = "%0A".join(l.replace("%", "%25").replace("\r", "") for l in tail)
          print(f"::error title=dotnet test failed (last lines of output)::{body}")

      - name: Check the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"; tag="${tag%%-*}"
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' build.yaml)
          if [[ "$tag.0" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match build.yaml version $version (expected v${version%.0}[-suffix])"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p artifacts
          cp src/Jellyfin.Plugin.Subtitles/bin/Release/net10.0/Jellyfin.Plugin.Subtitles.dll artifacts/
          (cd artifacts && zip -q ../jellyfin-plugin-subtitles.zip Jellyfin.Plugin.Subtitles.dll)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jellyfin-plugin-subtitles
          path: jellyfin-plugin-subtitles.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance: a signed statement that this zip was built by this workflow from this commit
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jellyfin-plugin-subtitles

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: jellyfin-plugin-subtitles.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags with a suffix (v0.1.0-alpha, v1.0.0-rc1) are published as pre-releases. The release is created as a draft,
        # given its files, then published, so it also works with immutable releases (no files can be added afterwards).
        run: |
          sha256sum jellyfin-plugin-subtitles.zip > SHA256SUMS
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" jellyfin-plugin-subtitles.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes --draft "${flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
