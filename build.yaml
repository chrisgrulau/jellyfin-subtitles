# Plugin metadata for Jellyfin Plugin Repository Manager (JPRM) packaging
name: "Shoal Subtitles"
guid: "95265809-b7a4-4721-8baf-6739c8e6287b"
version: "0.2.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "chrisgrulau"
overview: "Find, check and synchronise subtitles so they match the audio."
description: >
  Finds subtitles for videos that are missing them (OpenSubtitles through Jellyfin, subtitles embedded in the file,
  other providers), scores the candidates, checks them against the actual audio and synchronises their timing.
  Speech-to-text runs locally by default (built-in Whisper), with optional cloud services. Every change is reversible.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Subtitles.dll"
changelog: >
  0.2.0-alpha: built-in speech-to-text. Once you allow it, whisper.cpp and a speech model are downloaded from this
  project's releases, checked against checksums built into the plugin, and run on the server's CPU. Also: undo is
  safe after another tool replaces a subtitle, large libraries are checked once each, downloads and huge files are
  capped, Apply/Undo errors are shown, downloads default to 10 a day and stop when the provider's allowance is used up,
  and forced-only tracks no longer count as having subtitles.
