# Plugin metadata for Jellyfin Plugin Repository Manager (JPRM) packaging
name: "Shoal Subtitles"
guid: "95265809-b7a4-4721-8baf-6739c8e6287b"
version: "0.6.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "chrisgrulau"
overview: "Find, check and synchronise subtitles so they match the audio."
description: >
  Finds subtitles for videos that are missing them (OpenSubtitles through Jellyfin, subtitles embedded in the file,
  other providers), scores the candidates, checks them against the actual audio and synchronises their timing.
  Speech-to-text runs locally by default (built-in Whisper), with optional cloud services. Every change is reversible.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Subtitles.dll"
changelog: >
  0.6.0-alpha: with the Shoal AI plugin (if installed and allowing Subtitles). Lines matched by meaning: when a
  subtitle's words don't match what is said (a translation, a paraphrase), the AI pairs them by meaning and the pairs
  must agree on one timing. Wording audit: lines whose meaning differs from what is said (names, numbers, a missing
  "not") are flagged with suggested wording that waits for review; subtitles checked earlier are audited a few per
  run. At most 20 AI checks per run.
