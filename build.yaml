# Plugin metadata for Jellyfin Plugin Repository Manager (JPRM) packaging
name: "Shoal Subtitles"
guid: "95265809-b7a4-4721-8baf-6739c8e6287b"
version: "0.9.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "chrisgrulau"
overview: "Find, check and synchronise subtitles so they match the audio."
description: >
  Finds subtitles for videos that are missing them (OpenSubtitles through Jellyfin, subtitles embedded in the file,
  other providers), scores the candidates, checks them against the actual audio and synchronises their timing.
  Speech-to-text runs locally by default (built-in Whisper), with optional cloud services. Every change is reversible.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Subtitles.dll"
changelog: >
  0.9.0-alpha: languages are recognised from a built-in ISO 639 table, so the plugin works on servers without full
  language data. Subtitle languages accept codes or names (eng, fr, German); entries that aren't languages are noted
  in the log.
