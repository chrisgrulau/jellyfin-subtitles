# Plugin metadata for Jellyfin Plugin Repository Manager (JPRM) packaging
name: "Shoal Subtitles"
guid: "95265809-b7a4-4721-8baf-6739c8e6287b"
version: "0.1.0.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "chrisgrulau"
overview: "Find, check and synchronise subtitles so they match the audio."
description: >
  Finds subtitles for videos that are missing them (OpenSubtitles through Jellyfin, subtitles embedded in the file,
  other providers), scores the candidates, checks them against the actual audio and synchronises their timing.
  Speech-to-text runs locally by default (built-in Whisper), with optional cloud services. Every change is reversible.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Subtitles.dll"
changelog: >
  0.1.0-alpha, the first release: checks subtitle files beside films and episodes against the audio every day and fixes
  their timing (shifts and PAL frame-rate changes), first for free by matching line starts, then with a local
  speech-to-text service for the unclear cases; cleans adverts and bad timing; finds subtitles for videos that have
  none through Jellyfin's subtitle providers, adding one only if it fits the audio. Every change can be undone. The
  built-in speech-to-text and paid services in automatic runs are not in this release yet.
